<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Ops — Relatório de Intervenção Técnica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./app.css">
    <!-- Logica de prova (tabs / colapsaveis / auto-save). Vira Livewire+Alpine na conversao para Blade. -->
    <script>
        function formulario() {
            return {
                tab: 'gerais',
                salvamento: 'ativo', // 'ativo' | 'a-guardar' | 'guardado'
                _timer: null,
                editar() {
                    this.salvamento = 'a-guardar';
                    clearTimeout(this._timer);
                    this._timer = setTimeout(() => { this.salvamento = 'guardado'; }, 900);
                },
            }
        }
    </script>
    <script defer src="./alpine-collapse.min.js"></script>
    <script defer src="./alpine.min.js"></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body x-data="formulario()" class="min-h-screen">

<div class="flex min-h-screen">

    <!-- ============ SIDEBAR (injetada pelo shell.js) ============ -->
    <div data-sidebar></div>

    <!-- ============ COLUNA PRINCIPAL ============ -->
    <div class="flex min-w-0 flex-1 flex-col">

        <!-- Topbar -->
        <header class="flex items-center justify-between border-b border-borda bg-white px-10 py-5 shadow-topbar">
            <nav class="flex items-center gap-2 text-sm">
                <span class="text-texto-medio">Relatórios</span>
                <span class="text-texto-fraco">/</span>
                <span class="font-medium text-texto-forte">Configuração de Manutenção</span>
            </nav>
            <div class="flex items-center gap-3">
                <button class="botao-secundario">Guardar Rascunho</button>
                <button class="botao-primario">Finalizar Relatório</button>
            </div>
        </header>

        <!-- Conteudo. @input no wrapper captura edicao de qualquer campo (bubbling) -> auto-save -->
        <main class="flex-1 px-10 py-9" @input="editar()">
            <div class="mx-auto max-w-5xl">

                <!-- Cabecalho -->
                <div class="flex items-start justify-between">
                    <div>
                        <h1 class="text-3xl font-semibold tracking-tight text-texto-forte">Relatório de Intervenção Técnica</h1>
                        <p class="mt-2 text-sm text-texto-medio">Preencha todos os campos obrigatórios para submeter a folha de obra.</p>
                    </div>
                    <span class="inline-flex shrink-0 items-center rounded-md bg-aviso-100 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-aviso-500">Em Curso</span>
                </div>

                <!-- Tabs -->
                <div class="mt-8 flex gap-8 border-b border-borda">
                    <button @click="tab='gerais'" :class="tab==='gerais' ? 'border-verde-500 text-verde-600 font-semibold' : 'border-transparent text-texto-medio font-medium hover:text-texto-forte'" class="-mb-px border-b-2 pb-3 text-sm transition">Dados Gerais</button>
                    <button @click="tab='diagnostico'" :class="tab==='diagnostico' ? 'border-verde-500 text-verde-600 font-semibold' : 'border-transparent text-texto-medio font-medium hover:text-texto-forte'" class="-mb-px border-b-2 pb-3 text-sm transition">Diagnóstico</button>
                    <button @click="tab='fotografias'" :class="tab==='fotografias' ? 'border-verde-500 text-verde-600 font-semibold' : 'border-transparent text-texto-medio font-medium hover:text-texto-forte'" class="-mb-px border-b-2 pb-3 text-sm transition">Fotografias</button>
                </div>

                <!-- ===================== TAB: DADOS GERAIS ===================== -->
                <div x-show="tab==='gerais'" x-transition.opacity class="space-y-5">

                    <!-- Cartao 1: Dados do Cliente -->
                    <section class="cartao mt-7" x-data="{ aberto: true }">
                        <button @click="aberto=!aberto" class="cartao-cabecalho">
                            <span class="flex items-center gap-3">
                                <span class="cartao-icone">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5m14 0h2M5 21H3m6-14h1m-1 4h1m4-4h1m-1 4h1m-5 8v-4a1 1 0 011-1h2a1 1 0 011 1v4"/></svg>
                                </span>
                                <span class="text-lg font-semibold text-texto-forte">Dados do Cliente e Equipamento</span>
                            </span>
                            <svg :class="aberto && 'rotate-180'" class="h-5 w-5 text-texto-fraco transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="aberto" x-collapse class="grid grid-cols-2 gap-x-8 gap-y-6 px-6 pb-7">
                            <div>
                                <label class="campo-label">Cliente</label>
                                <input type="text" class="campo-input" placeholder="Ex: Central Elétrica Norte">
                            </div>
                            <div>
                                <label class="campo-label">Referência Interna</label>
                                <input type="text" class="campo-input" placeholder="Ex: UPS-404-B">
                            </div>
                            <div>
                                <label class="campo-label">Tipo de Ativo</label>
                                <select class="campo-select">
                                    <option>Power Grid Manager</option>
                                    <option>UPS</option>
                                    <option>Gerador</option>
                                    <option>PDU</option>
                                </select>
                            </div>
                            <div>
                                <label class="campo-label">Data de Intervenção</label>
                                <input type="date" class="campo-input">
                            </div>
                        </div>
                    </section>

                    <!-- Cartao 2: Constatacoes -->
                    <section class="cartao" x-data="{ aberto: true }">
                        <button @click="aberto=!aberto" class="cartao-cabecalho">
                            <span class="flex items-center gap-3">
                                <span class="cartao-icone">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                                </span>
                                <span class="text-lg font-semibold text-texto-forte">Constatações Técnicas</span>
                            </span>
                            <svg :class="aberto && 'rotate-180'" class="h-5 w-5 text-texto-fraco transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="aberto" x-collapse class="px-6 pb-7">
                            <label class="campo-label">Resumo da Intervenção</label>
                            <textarea rows="3" class="campo-input resize-none" placeholder="Descreva as constatações técnicas observadas durante a intervenção..."></textarea>
                        </div>
                    </section>

                    <!-- Cartao 3: Recomendacoes -->
                    <section class="cartao" x-data="{ aberto: true }">
                        <button @click="aberto=!aberto" class="cartao-cabecalho">
                            <span class="flex items-center gap-3">
                                <span class="cartao-icone">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                                </span>
                                <span class="text-lg font-semibold text-texto-forte">Recomendações e Próximos Passos</span>
                            </span>
                            <svg :class="aberto && 'rotate-180'" class="h-5 w-5 text-texto-fraco transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="aberto" x-collapse class="flex items-end gap-3 px-6 pb-7">
                            <div class="flex-1">
                                <input type="text" class="campo-input" placeholder="Ex: Substituição de baterias">
                            </div>
                            <div class="w-44">
                                <select class="campo-select">
                                    <option>Imediata</option>
                                    <option>Alta</option>
                                    <option>Normal</option>
                                </select>
                            </div>
                            <button class="flex h-[46px] w-[46px] shrink-0 items-center justify-center rounded-lg border border-borda text-texto-fraco transition hover:bg-fundo hover:text-texto-medio">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </section>

                    <!-- Cartao 4: Registo Fotografico -->
                    <section class="cartao" x-data="{ aberto: true }">
                        <button @click="aberto=!aberto" class="cartao-cabecalho">
                            <span class="flex items-center gap-3">
                                <span class="cartao-icone">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                </span>
                                <span class="text-lg font-semibold text-texto-forte">Registo Fotográfico</span>
                            </span>
                            <svg :class="aberto && 'rotate-180'" class="h-5 w-5 text-texto-fraco transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="aberto" x-collapse class="grid grid-cols-4 gap-4 px-6 pb-7">
                            <label class="flex aspect-square cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-borda text-texto-fraco transition hover:border-verde-400 hover:text-verde-500">
                                <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                                <span class="text-xs font-medium">Carregar foto</span>
                            </label>
                            <div class="relative aspect-square overflow-hidden rounded-xl bg-zinc-800">
                                <div class="absolute inset-0 bg-gradient-to-br from-zinc-700 to-zinc-900"></div>
                                <span class="absolute right-2 top-2 h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white/30"></span>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- ===================== TAB: DIAGNOSTICO ===================== -->
                <div x-show="tab==='diagnostico'" x-transition.opacity x-cloak class="mt-7">
                    <section class="cartao" x-data="{ aberto: true }">
                        <button @click="aberto=!aberto" class="cartao-cabecalho">
                            <span class="flex items-center gap-3">
                                <span class="cartao-icone">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                </span>
                                <span class="text-lg font-semibold text-texto-forte">Diagnóstico do Equipamento</span>
                            </span>
                            <svg :class="aberto && 'rotate-180'" class="h-5 w-5 text-texto-fraco transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div x-show="aberto" x-collapse class="grid grid-cols-2 gap-x-8 gap-y-6 px-6 pb-7">
                            <div>
                                <label class="campo-label">Estado Geral</label>
                                <select class="campo-select">
                                    <option>Operacional</option>
                                    <option>Degradado</option>
                                    <option>Crítico</option>
                                </select>
                            </div>
                            <div>
                                <label class="campo-label">Carga Atual (%)</label>
                                <input type="number" class="campo-input" placeholder="Ex: 62">
                            </div>
                            <div>
                                <label class="campo-label">Tensão de Entrada (V)</label>
                                <input type="number" class="campo-input" placeholder="Ex: 230">
                            </div>
                            <div>
                                <label class="campo-label">Tensão de Saída (V)</label>
                                <input type="number" class="campo-input" placeholder="Ex: 230">
                            </div>
                            <div class="col-span-2">
                                <label class="campo-label">Anomalias Detetadas</label>
                                <textarea rows="3" class="campo-input resize-none" placeholder="Registe quaisquer anomalias observadas nas leituras ou no comportamento do equipamento..."></textarea>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- ===================== TAB: FOTOGRAFIAS ===================== -->
                <div x-show="tab==='fotografias'" x-transition.opacity x-cloak class="mt-7">
                    <section class="cartao">
                        <div class="cartao-cabecalho">
                            <span class="flex items-center gap-3">
                                <span class="cartao-icone">
                                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                                </span>
                                <span class="text-lg font-semibold text-texto-forte">Galeria da Intervenção</span>
                            </span>
                            <span class="text-xs font-medium text-texto-fraco">3 ficheiros</span>
                        </div>
                        <div class="grid grid-cols-4 gap-4 px-6 pb-7">
                            <label class="flex aspect-square cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-borda text-texto-fraco transition hover:border-verde-400 hover:text-verde-500">
                                <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                                <span class="text-xs font-medium">Carregar foto</span>
                            </label>
                            <div class="relative aspect-square overflow-hidden rounded-xl bg-gradient-to-br from-zinc-700 to-zinc-900"><span class="absolute right-2 top-2 h-2.5 w-2.5 rounded-full bg-red-500 ring-2 ring-white/30"></span></div>
                            <div class="aspect-square overflow-hidden rounded-xl bg-gradient-to-br from-slate-600 to-slate-800"></div>
                            <div class="aspect-square overflow-hidden rounded-xl bg-gradient-to-br from-zinc-600 to-zinc-900"></div>
                        </div>
                    </section>
                </div>

                <!-- Rodape com indicador de auto-save dinamico -->
                <footer class="mt-12 text-center">
                    <div class="text-xs font-semibold uppercase tracking-[0.2em] text-texto-fraco">Nexus Solutions Operations</div>
                    <div class="mt-3 flex items-center justify-center gap-6 text-xs text-texto-fraco">
                        <span class="inline-flex items-center gap-1.5">
                            <svg class="h-4 w-4 text-verde-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                            Transmissão Segura
                        </span>
                        <span class="inline-flex items-center gap-1.5">
                            <svg class="h-4 w-4 transition-colors" :class="salvamento==='guardado' ? 'text-verde-500' : (salvamento==='a-guardar' ? 'text-aviso-500' : 'text-verde-500')" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <span x-show="salvamento==='ativo'">Auto-Save Ativo</span>
                            <span x-show="salvamento==='a-guardar'" x-cloak class="text-aviso-500">A guardar…</span>
                            <span x-show="salvamento==='guardado'" x-cloak class="text-verde-600">Guardado</span>
                        </span>
                    </div>
                </footer>

            </div>
        </main>
    </div>
</div>

<script src="./shell.js"></script>
<script>renderSidebar('relatorios');</script>
</body>
</html>
